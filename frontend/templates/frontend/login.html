{% extends "frontend/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 420px">
  <div class="card-body p-4">
    <h1 class="h3 mb-3">Log in</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" type="email" class="form-control" autocomplete="email"
               value="{{ request.form.get('email', '') }}" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="form-check mb-3">
        <input id="remember" name="remember" type="checkbox" class="form-check-input">
        <label for="remember" class="form-check-label">Remember me</label>
      </div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('frontend.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
